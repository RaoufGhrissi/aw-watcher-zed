[package]
name = "activitywatch-ls"
version.workspace = true
edition = "2021"
repository = "https://github.com/sachk/aw-watcher-zed"


[dependencies]
chrono = "0.4"
clap = "4.5"
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1.44", features = ["rt", "io-std", "macros"] }
tower-lsp = "0.20"
url = "2.5"
# Pinned: later commits of this fork make the client blocking, which this async server does not use
aw-client-rust = { git = "https://github.com/sachk/aw-server-rust", rev = "083021e" }
arc-swap = "1.7"
percent-encoding = "2.3"
